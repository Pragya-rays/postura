[project]
name = "postura-scanner"
version = "0.1.0"
description = "Postura standalone scanner: passive collectors + deterministic Judge rules engine. No web framework dependency — runnable via `python -m scanner <domain>`."
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27.0",
    "dnspython>=2.6.1",
    "python-whois>=0.9.4",
    "cryptography>=43.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "respx>=0.21.1",
]

[tool.setuptools.packages.find]
include = ["scanner*"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
asyncio_mode = "auto"
